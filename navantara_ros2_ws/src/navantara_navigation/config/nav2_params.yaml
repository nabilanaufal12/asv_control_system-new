# navantara_navigation / config/nav2_params.yaml
# Nav2 Configuration for Autonomous Surface Vessel (ASV) Navantara

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 1.5
      lookahead_dist: 3.0
      min_lookahead_dist: 1.5
      max_lookahead_dist: 6.0
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.8
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.5
      use_approach_linear_velocity_scaling: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 40
      height: 40
      resolution: 0.1
      footprint: "[ [0.9, 0.45], [0.9, -0.45], [-0.9, -0.45], [-0.9, 0.45] ]"
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: buoy_pointcloud
        buoy_pointcloud:
          topic: /perception/obstacle_points
          data_type: "PointCloud2"
          max_obstacle_height: 2.0
          min_obstacle_height: -0.5
          obstacle_max_range: 25.0
          raytrace_max_range: 30.0
          clearing: false
          marking: true
          # Spatial memory: Retains buoy points even if camera momentarily loses sight due to pitch/roll
          observation_persistence: 4.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 1.2
        cost_scaling_factor: 3.0
